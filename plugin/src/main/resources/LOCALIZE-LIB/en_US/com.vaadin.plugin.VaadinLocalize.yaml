import.exclusion.awt.title:
  text: Exclude java.awt from auto-import?
import.exclusion.awt.content:
  text: Vaadin and AWT share class names such as Button and TextField. Excluding java.awt stops code completion and auto-import from offering the AWT classes. Answer No if this project uses AWT too.
